<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Jumping Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <header class="game-header">
            <div class="score-board">Score: <span id="scoreVal">0</span></div>
            <h1>Robot Jumping Game</h1>
        </header>

        <main id="gameBoard" class="game-board">
            <div id="robot" class="robot"></div>
        </main>

        <div id="startOverlay" class="overlay">
            <div class="modal">
                <h2>Ready for the Challenge?</h2>
                <p>Press Space or Click to Jump</p>
                <button id="startBtn">Start Game</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
